# Netlify yayın ayarları.
# Bu dosya depoda durduğu için Netlify arayüzünde ayar girmeye gerek kalmaz;
# Netlify buradaki değerleri kendiliğinden okur.

[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Bilinmeyen bir adres istendiğinde sitenin kendi 404 sayfası gösterilsin.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
